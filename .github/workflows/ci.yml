name: Bank Account Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # Cypress 16 (versión actual) exige Node 22, 24 o superior.
          # Con Node 20 (como aparece en el enunciado) el pipeline fallaría.
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas E2E UI con Cypress
        run: npx cypress run --spec "cypress/e2e/cuenta_bancaria.cy.js"

      # Solo si algo falla: guarda las capturas que toma Cypress para depurar
      - name: Subir capturas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
